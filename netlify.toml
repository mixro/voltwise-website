[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Multi-page site with client-side routing: serve index.html for every page URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
